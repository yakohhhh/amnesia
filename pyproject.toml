[build-system]
requires = ["setuptools>=68,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "amnesia-dfr"
version = "0.0.1"
description = "Audit de forensic readiness: ce que ton SI aura oublie le jour de l'incident"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ayman Mazroui" }]

[project.scripts]
amnesia = "amnesia.cli:main"

[dependency-groups]
# versions exactes ; uv.lock fige aussi les dependances transitives et leurs empreintes
dev = [
    "nox==2026.8.17",
    "pre-commit==4.7.0",
    "pre-commit-hooks==6.0.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.3",
    "ruff==0.17.1",
]
# outils d'audit de la CI, hors groupe dev (installes a la demande)
ci = [
    "zizmor==1.30.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# target-version n'est pas fixe : ruff la deduit de project.requires-python.
line-length = 88
src = ["src", "tests"]
extend-exclude = ["tests/fixtures/**/raw"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle (erreurs)
    "W",    # pycodestyle (avertissements)
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # chemins via pathlib
    "RUF",  # regles propres a ruff
    "T20",  # print / pprint oublies
    "DTZ",  # datetime sans fuseau : critique pour des horodatages d'enquete
    "S",    # flake8-bandit (securite)
    "PLE",  # erreurs pylint, dont PLE2502/PLE251x : caracteres bidi et invisibles
            # (Trojan Source, CVE-2021-42574), actives par defaut dans ruff
    "PGH004",  # noqa sans code interdit : il eteindrait aussi S et DTZ
]
# apostrophe typographique et tiret demi-cadratin des textes francais
allowed-confusables = ["’", "–"]

[tool.ruff.lint.per-file-ignores]
# la CLI ecrit sur la sortie standard par conception
"src/amnesia/cli.py" = ["T201"]
# assert est l'idiome de pytest
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["amnesia"]

[tool.ruff.format]
docstring-code-format = true

[tool.uv]
# Delai de carence : aucune distribution publiee depuis moins de 7 jours, pour
# laisser le temps de detecter une release compromise avant de l'installer.
exclude-newer = "7 days"
# Backend de build fige pour uv (dev et CI), enregistre dans uv.lock et verifie
# par --locked. build-system.requires garde une plage pour les autres outils.
build-constraint-dependencies = ["setuptools==84.0.0"]
