[build-system]
requires = ["setuptools>=68,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "amnesia-dfr"
# source unique de la version : __version__ dans src/amnesia/__init__.py
dynamic = ["version"]
description = "Audit de forensic readiness : ce que ton SI aura oublié le jour de l'incident"
# plancher justifie dans docs/PAQUET.md ; matrice CI, nox et classifiers le suivent
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ayman Mazroui" }]
keywords = [
    "forensic readiness",
    "DFIR",
    "incident response",
    "audit",
    "logging",
    "Windows",
    "Active Directory",
    "Sysmon",
    "SIEM",
    "Microsoft 365",
    "CloudTrail",
]
# Aucun classifier « License :: » (PEP 639, #30). Une entree par version de la
# matrice CI : tests/test_paquet.py verifie la concordance. « Typing :: Typed » :
# PEP 561, le paquet publie ses annotations (marqueur amnesia/py.typed).
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Natural Language :: French",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

[project.urls]
# Depot prive : ces liens renvoient une 404 aux visiteurs tant que la visibilite
# n'est pas tranchee (#11, #13). Changelog : CHANGELOG.md, tenu selon
# docs/RELEASING.md (tests/test_versionnage.py verifie le lien).
Homepage = "https://github.com/yakohhhh/amnesia"
Repository = "https://github.com/yakohhhh/amnesia"
Issues = "https://github.com/yakohhhh/amnesia/issues"
Changelog = "https://github.com/yakohhhh/amnesia/blob/main/CHANGELOG.md"

[project.scripts]
amnesia = "amnesia.cli:main"

[dependency-groups]
# versions exactes ; uv.lock fige aussi les dependances transitives et leurs empreintes
dev = [
    "hypothesis==6.170.2",
    # validation du rapport contre son JSON Schema (#22) : tests seulement, le
    # paquet installe n'en depend pas
    "jsonschema==4.26.0",
    "mypy==2.4.0",
    "nox==2026.8.17",
    "pre-commit==4.7.0",
    "pre-commit-hooks==6.0.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.1",
    "pyyaml==6.0.3",
    "ruff==0.17.1",
    # backend de build, meme version que build-constraint-dependencies : les
    # tests construisent le wheel hors ligne (tests/test_paquet.py)
    "setuptools==84.2.1",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20260906",
]
# outils d'audit de la CI, hors groupe dev (installes a la demande)
ci = [
    # schemas embarques (--builtin-schema) : .github/dependabot.yml valide hors ligne
    "check-jsonschema==0.38.2",
    "zizmor==1.30.1",
]
# audit des vulnerabilites connues de uv.lock (job CI pip-audit) : groupe a part,
# ses dependances (requests, cyclonedx...) n'entrent ni dans dev ni dans ci
audit = [
    "pip-audit==2.10.1",
]
# controle du paquet construit (session nox build)
build = [
    "check-wheel-contents==0.6.3",
    "twine==7.0.0",
    # [all] : classifiers verifies hors ligne avec trove-classifiers
    "validate-pyproject[all]==0.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# lu statiquement (AST) : le paquet n'est pas importe pendant le build
version = { attr = "amnesia.__version__" }

[tool.setuptools.package-data]
# donnees embarquees dans le wheel : marqueur PEP 561 (les auteurs de checks tiers
# heritent des types de Check et Gap), schemas (#22), catalogue (#46) et gabarits
# de rapport (#77) ; tests/test_paquet.py verifie leur presence
amnesia = ["py.typed", "schemas/*.json", "catalog/*.toml", "templates/**/*"]

[tool.pytest.ini_options]
# Marqueurs (windows, admin, lab, cloud, network) et options --run-* :
# tests/conftest.py, qui les declare et les applique.
testpaths = ["tests"]
# --import-mode=importlib : fichiers de test homonymes permis (unit/, integration/)
# -p no:socket : hooks de pytest-socket desactives, le conftest coupe le reseau
# lui-meme avec ses fonctions (voir sa docstring)
addopts = "-ra --strict-markers --strict-config --import-mode=importlib -p no:socket"
xfail_strict = true
filterwarnings = [
    "error",
    # pytest-socket double SocketBlockedError d'un UserWarning, que "error"
    # leverait a la place de l'exception attendue
    "ignore:A test tried to use socket:UserWarning",
]

[tool.coverage.run]
branch = true
source = ["amnesia"]

[tool.coverage.report]
# applique par pytest-cov des que --cov est passe (job CI test, session nox tests)
fail_under = 80

[tool.ruff]
# target-version n'est pas fixe : ruff la deduit de project.requires-python.
line-length = 88
src = ["src", "tests"]
extend-exclude = ["tests/fixtures/**/raw"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle (erreurs)
    "W",    # pycodestyle (avertissements)
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # chemins via pathlib
    "RUF",  # regles propres a ruff
    "T20",  # print / pprint oublies
    "DTZ",  # datetime sans fuseau : critique pour des horodatages d'enquete
    "S",    # flake8-bandit (securite)
    "PLE",  # erreurs pylint, dont PLE2502/PLE251x : caracteres bidi et invisibles
            # (Trojan Source, CVE-2021-42574), actives par defaut dans ruff
    "PGH004",  # noqa sans code interdit : il eteindrait aussi S et DTZ
    "TID251",  # API interdites (banned-api ci-dessous)
]
# apostrophe typographique et tiret demi-cadratin des textes francais
allowed-confusables = ["’", "–"]

[tool.ruff.lint.per-file-ignores]
# la CLI ecrit sur la sortie standard par conception
"src/amnesia/cli.py" = ["T201"]
# assert est l'idiome de pytest
"tests/**" = ["S101"]

# set_stream_logger pose sur botocore un handler sans plafond ni expurgation :
# les requetes signees (Authorization, X-Amz-Security-Token) sortiraient en clair
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"boto3.set_stream_logger".msg = "contourne l'expurgation des journaux (amnesia.log)"
"botocore.session.Session.set_stream_logger".msg = "contourne l'expurgation des journaux (amnesia.log)"

[tool.ruff.lint.isort]
known-first-party = ["amnesia"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
# Sans argument, « uv run mypy » verifie src et tests. Aucun
# ignore_missing_imports global : un SDK sans types (WinRM, Graph, boto3) recoit
# un override [[tool.mypy.overrides]] limite a ses modules, dans le ticket qui
# l'introduit.
strict = true
python_version = "3.11"  # plancher de requires-python
files = ["src", "tests"]
warn_unreachable = true

[tool.uv]
# Delai de carence : aucune distribution publiee depuis moins de 7 jours, pour
# laisser le temps de detecter une release compromise avant de l'installer.
exclude-newer = "7 days"
# Backend de build fige pour uv (dev et CI), enregistre dans uv.lock et verifie
# par --locked. build-system.requires garde une plage pour les autres outils.
build-constraint-dependencies = ["setuptools==84.2.1"]
