# Taxonomie des labels du depot, appliquee par scripts/sync_github.py
# (voir docs/dev/github.md). Couleur : 6 chiffres hexadecimaux sans « # » ;
# description : 100 caracteres au plus (limite de GitHub).
# Un label present sur GitHub mais absent d'ici n'est supprime qu'avec --prune,
# et seulement si aucune issue ni PR ne le porte.
labels:
  # Nature du ticket
  - name: "type:feature"
    color: "1d76db"
    description: "Nouvelle fonctionnalité"
  - name: "type:bug"
    color: "d73a4a"
    description: "Quelque chose ne marche pas"
  - name: "type:chore"
    color: "fef2c0"
    description: "Outillage / maintenance"
  - name: "type:docs"
    color: "0075ca"
    description: "Documentation"
  - name: "type:security"
    color: "b60205"
    description: "Sécurité de l'outil"
  - name: "type:test"
    color: "bfd4f2"
    description: "Tests"
  - name: "type:research"
    color: "d4c5f9"
    description: "Étude / décision à prendre"

  # Priorite
  - name: "priority:high"
    color: "d93f0b"
    description: "Prioritaire"
  - name: "priority:medium"
    color: "fbca04"
    description: "Priorité moyenne"
  - name: "priority:low"
    color: "c2e0c6"
    description: "Priorité basse"

  # Partie du projet concernee
  - name: "area:core"
    color: "5319e7"
    description: "Moteur, modèle, runner"
  - name: "area:cli"
    color: "006b75"
    description: "Interface en ligne de commande"
  - name: "area:windows"
    color: "0e8a16"
    description: "Checks endpoints Windows"
  - name: "area:ad"
    color: "1d7a3a"
    description: "Checks Active Directory"
  - name: "area:cloud"
    color: "0052cc"
    description: "Checks cloud (M365, Entra, AWS…)"
  - name: "area:siem"
    color: "3e4b9e"
    description: "Pipeline / forwarding SIEM"
  - name: "area:report"
    color: "e99695"
    description: "Rapport et rendu"
  - name: "area:ci"
    color: "ededed"
    description: "Intégration continue"
  - name: "area:packaging"
    color: "c5def5"
    description: "Packaging et release"
  - name: "area:docs"
    color: "bfdadc"
    description: "Documentation"
  - name: "area:legal"
    color: "f9d0c4"
    description: "Légal et conformité"
  - name: "area:business"
    color: "fef2c0"
    description: "Produit et modèle commercial"

  - name: "good first issue"
    color: "7057ff"
    description: "Bon point de départ"

  # Labels par defaut de GitHub conserves, descriptions traduites
  - name: "help wanted"
    color: "008672"
    description: "Aide extérieure bienvenue"
  - name: "duplicate"
    color: "cfd3d7"
    description: "Doublon d'une issue ou d'une PR existante"
  - name: "invalid"
    color: "e4e669"
    description: "Invalide ou hors sujet"
  - name: "wontfix"
    color: "ffffff"
    description: "Ne sera pas traité"
  - name: "question"
    color: "d876e3"
    description: "Précisions demandées"
