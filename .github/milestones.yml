# Milestones du depot, appliquees par scripts/sync_github.py (voir
# docs/dev/github.md). Identifiees par leur titre exact, tiret cadratin compris :
# renommer une milestone ici en creerait une nouvelle. Une milestone absente d'ici
# n'est jamais supprimee. « state » (open ou closed) est facultatif : sans lui,
# l'etat decide sur GitHub est laisse tel quel.
# Une milestone versionnee commence sa description par « Version X.Y.Z — », comme
# la table milestones -> versions de docs/RELEASING.md ; tests/test_versionnage.py
# verifie la concordance.
milestones:
  - title: "M0 — Scaffold"
    description: "Version 0.1.0 — mise en place"
  - title: "M1 — MVP (Windows + AD)"
    description: "Version 0.2.0 — checks endpoints + AD + rapport des angles morts"
  - title: "M2 — Cloud"
    description: "Version 0.3.0 — M365/Entra, CloudTrail, forwarding SIEM"
  - title: "M3 — Linux & virtualisation"
    description: >-
      Version 0.4.0 — cibles Linux et virtualisation : collecte SSH,
      journald/rsyslog/logrotate, auditd, collecteur POSIX hors ligne, vSphere
      (vCenter et ESXi).
  - title: "Offre v0 — prestation pilote"
    description: >-
      Piste commerciale et juridique du premier diagnostic payant : positionnement,
      offre, cadre contractuel, méthodologie de mission, pilote client et landing
      page. Calendrier propre, dépend du livrable du M1.
  - title: "Backlog"
    description: "Plus tard"
