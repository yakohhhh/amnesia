name: ci
on:
  push:
  pull_request:
env:
  # toute commande uv echoue si uv.lock n'est plus a jour avec pyproject.toml
  UV_LOCKED: "1"
  # uv applique les empreintes de uv.lock : son propre binaire est donc verifie
  # (asset digest de la release GitHub immuable, fichier .sha256 publie et table
  # de setup-uv, concordants). Toute montee de version change les trois lignes.
  UV_VERSION: "0.13.0"
  UV_SHA256_LINUX_X64: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
  UV_SHA256_WINDOWS_X64: "088962f9e7b7bd9ea740c04c650b2a21c8928c345bd99ac24350dc924dba656c"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_LINUX_X64 }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # du plancher de requires-python a la derniere version stable
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_LINUX_X64 }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  nox-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_WINDOWS_X64 }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run nox -s lint tests-3.15
