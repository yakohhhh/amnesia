name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # chaque lundi sur main : une vulnerabilite publiee depuis le dernier push fait
  # echouer le job pip-audit sans attendre une modification du lock
  schedule:
    - cron: "17 5 * * 1"

# aucun droit par defaut : chaque job declare le strict necessaire
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # toute commande uv echoue si uv.lock n'est plus a jour avec pyproject.toml
  UV_LOCKED: "1"
  # uv applique les empreintes de uv.lock : son propre binaire est donc verifie
  # (asset digest de la release GitHub immuable, fichier .sha256 publie et table
  # de setup-uv, concordants). Toute montee de version change les trois lignes.
  UV_VERSION: "0.13.0"
  UV_SHA256_LINUX_X64: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
  UV_SHA256_WINDOWS_X64: "088962f9e7b7bd9ea740c04c650b2a21c8928c345bd99ac24350dc924dba656c"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_LINUX_X64 }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_LINUX_X64 }}
          enable-cache: true
      - run: uv sync --locked
      # mypy --strict sur src et tests, configure dans [tool.mypy]
      - run: uv run mypy

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # EncodingWarning (PEP 597) sur tout open() ou subprocess texte sans
      # encoding explicite, traite en erreur par pytest (docs/dev/encodage.md).
      # Le job nox-windows recoit les memes variables du noxfile.
      PYTHONWARNDEFAULTENCODING: "1"
      PYTEST_ADDOPTS: "-W error::EncodingWarning"
    strategy:
      fail-fast: false
      matrix:
        # du plancher de requires-python a la derniere version stable
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_LINUX_X64 }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      # seuil de couverture : [tool.coverage.report] fail_under dans pyproject
      - run: uv run pytest -q --cov --cov-report=term-missing
      # fichiers ignores compris : les sorties d'amnesia (amnesia-report*,
      # reports/, *.pdf...) le sont ; seuls les caches d'outillage sont toleres
      - name: aucun fichier ecrit dans le depot par les tests
        run: |
          ignores="$(git ls-files --others --ignored --exclude-standard --directory \
            | grep -Ev '^(\.venv/|\.pytest_cache/|\.coverage$|src/[^/]+\.egg-info/)|(^|/)__pycache__/$' \
            || true)"
          git status --porcelain --untracked-files=all
          echo "$ignores"
          test -z "$(git status --porcelain --untracked-files=all)$ignores"

  nox-windows:
    name: nox-windows
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_WINDOWS_X64 }}
          enable-cache: true
      - run: uv sync --locked
      # typecheck aussi sous Windows : mypy n'analyse les branches
      # « sys.platform == "win32" » que sur cette plateforme ;
      # build : wheel installe dans un venv vierge sous Windows
      - run: uv run nox -s lint typecheck tests-3.15 build

  # sdist et wheel construits, controles (validate-pyproject, twine check
  # --strict, check-wheel-contents) puis installes dans un venv vierge
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_LINUX_X64 }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run nox -s build

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_LINUX_X64 }}
          enable-cache: true
      - name: actionlint (binaire officiel, empreinte verifiee)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      # .github/ : les workflows et .github/dependabot.yml (cooldown, execution
      # de code externe)
      - name: zizmor (version figee dans uv.lock, audits en ligne)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --only-group ci zizmor --format=github .github/
      - name: configuration Dependabot conforme au schema (embarque, hors ligne)
        run: >-
          uv run --only-group ci check-jsonschema
          --builtin-schema vendor.dependabot .github/dependabot.yml
      # tous les formulaires du repertoire, config.yml a part (autre schema)
      - name: formulaires d'issues conformes au schema (embarque, hors ligne)
        run: |
          shopt -s nullglob
          formulaires=()
          for f in .github/ISSUE_TEMPLATE/*.yml .github/ISSUE_TEMPLATE/*.yaml; do
            case "${f##*/}" in
              config.yml | config.yaml) ;;
              *) formulaires+=("$f") ;;
            esac
          done
          uv run --only-group ci check-jsonschema \
            --builtin-schema vendor.github-issue-forms "${formulaires[@]}"
      - name: config.yml des issues conforme au schema (embarque, hors ligne)
        run: >-
          uv run --only-group ci check-jsonschema
          --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        # bash -eo pipefail : un echec en amont d'un pipe fait echouer l'etape
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (binaire officiel, empreinte verifiee)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      # Scans avant toute installation : l'arbre ne contient que le depot.
      # Options communes :
      # - --ignore-gitleaks-allow : un « gitleaks:allow » ajoute puis retire ne doit
      #   pas masquer un secret reste dans l'historique ; une exception legitime va
      #   dans .gitleaks.toml, revue dans le diff ;
      # - --max-archive-depth=2 : un .zip (ou un bundle dans un zip) est ouvert.
      - name: gitleaks sur tout l'historique (lignes ajoutees, merges compris)
        # --log-opts remplace les options par defaut de gitleaks : on les reprend et
        # on ajoute --diff-merges=remerge, sans quoi un secret introduit dans un
        # commit de fusion n'est jamais vu.
        run: >-
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose
          --config .gitleaks.toml --ignore-gitleaks-allow --max-archive-depth=2
          --log-opts="--all --full-history --diff-filter=tuxdb --diff-merges=remerge" .
      - name: gitleaks sur l'arbre (fichiers entiers, regles composites)
        run: >-
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --verbose
          --config .gitleaks.toml --ignore-gitleaks-allow --max-archive-depth=2 .
      # Les regles composites ne voient leur contexte qu'en mode dir : chaque
      # version de chaque fichier de l'historique est donc analysee entiere. Les
      # blobs sont ecrits sous leur SHA (jamais sous un chemin venu du depot), avec
      # le seul nom de base pour les regles qui dependent de l'extension. Un blob
      # UTF-16 (exports Windows) est aussi analyse converti en UTF-8.
      - name: gitleaks sur chaque version de fichier de l'historique
        run: |
          blobs="$RUNNER_TEMP/blobs"
          mkdir -p "$blobs"
          git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(rest)' \
            | awk '$1 == "blob"' \
            | while read -r _ sha chemin; do
                nom="$(basename -- "${chemin:-blob}")"
                mkdir -p "$blobs/$sha"
                git cat-file blob "$sha" > "$blobs/$sha/$nom"
                bom="$(head -c 2 "$blobs/$sha/$nom" | od -An -tx1 | tr -d ' \n')"
                if [ "$bom" = "fffe" ] || [ "$bom" = "feff" ]; then
                  mkdir -p "$blobs/$sha/utf8"
                  iconv -f UTF-16 -t UTF-8 "$blobs/$sha/$nom" > "$blobs/$sha/utf8/$nom"
                fi
              done
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --verbose \
            --config .gitleaks.toml --ignore-gitleaks-allow --max-archive-depth=2 "$blobs"
      - name: gitleaks sur les messages de commit et de tag
        run: |
          {
            git log --all --format='%H%n%an <%ae>%n%cn <%ce>%n%B'
            git for-each-ref refs/tags \
              --format='%(refname)%0a%(taggername) %(taggeremail)%0a%(contents)'
          } | "$RUNNER_TEMP/gitleaks" stdin --redact --no-banner --verbose \
            --config .gitleaks.toml --ignore-gitleaks-allow
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_LINUX_X64 }}
          enable-cache: true
      - run: uv sync --locked
      # Garde-fous anti-fuite cote serveur : les hooks locaux se contournent
      # (--no-verify, clone sans pre-commit install, gitleaks:allow), pas ces
      # controles. Ils portent sur tout l'historique, y compris les fichiers
      # supprimes depuis.
      - name: aucun fichier interdit dans l'historique ni dans l'arbre
        run: uv run python scripts/verifier_chemins.py
      - name: regles gitleaks verifiees avec ce binaire
        run: GITLEAKS_BIN="$RUNNER_TEMP/gitleaks" uv run pytest -q tests/test_gitleaks.py

  # Vulnerabilites connues (base de PyPI, alimentee par OSV) de toutes les
  # dependances figees dans uv.lock, groupes compris ; bloquant. Procedure et
  # exceptions : docs/dev/dependances.md.
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_LINUX_X64 }}
          enable-cache: true
      # Export PEP 751 (pylock.toml) plutot que requirements.txt : avec -r,
      # pip-audit evalue les marqueurs et saute les paquets d'une autre plateforme
      # (sys_platform == 'win32') ; avec --locked, il audite chaque paquet du lock.
      # --all-extras : un SDK declare en extra (amnesia-dfr[aws]) reste audite.
      # --no-emit-project : le projet lui-meme n'est pas sur PyPI.
      # --quiet : sans lui, uv affiche aussi tout l'export dans le journal.
      - name: export de uv.lock (PEP 751)
        run: >-
          uv export --quiet --locked --all-groups --all-extras --no-emit-project
          --format pylock.toml --output-file "$RUNNER_TEMP/audit/pylock.toml"
      - name: pip-audit
        run: |
          # Exceptions : une par ligne, chacune avec l'identifiant, la raison et la
          # date de revue (tests/test_dependances.py le verifie), par exemple :
          #   --ignore-vuln=GHSA-xxxx-xxxx-xxxx  # raison ; revue le AAAA-MM-JJ
          # Aucune autre option sur la commande : argparse accepte les formes
          # abregees (--ig=...), le test compare donc la commande exacte.
          exceptions=(
          )
          uv run --only-group audit pip-audit --strict --locked --aliases=on \
            --progress-spinner=off "${exceptions[@]}" "$RUNNER_TEMP/audit"

  # Seul check a rendre obligatoire (#13) : son nom ne change pas quand la
  # matrice evolue, et il echoue si un seul job echoue ou est annule.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      [lint, typecheck, test, nox-windows, build, workflow-lint, gitleaks, pip-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: tous les jobs ont reussi
        env:
          RESULTATS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultats : $RESULTATS"
          for r in $RESULTATS; do
            [ "$r" = "success" ] || exit 1
          done
