name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# aucun droit par defaut : chaque job declare le strict necessaire
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # toute commande uv echoue si uv.lock n'est plus a jour avec pyproject.toml
  UV_LOCKED: "1"
  # uv applique les empreintes de uv.lock : son propre binaire est donc verifie
  # (asset digest de la release GitHub immuable, fichier .sha256 publie et table
  # de setup-uv, concordants). Toute montee de version change les trois lignes.
  UV_VERSION: "0.13.0"
  UV_SHA256_LINUX_X64: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
  UV_SHA256_WINDOWS_X64: "088962f9e7b7bd9ea740c04c650b2a21c8928c345bd99ac24350dc924dba656c"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_LINUX_X64 }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # du plancher de requires-python a la derniere version stable
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_LINUX_X64 }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  nox-windows:
    name: nox-windows
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_WINDOWS_X64 }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run nox -s lint tests-3.15

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_LINUX_X64 }}
          enable-cache: true
      - name: actionlint (binaire officiel, empreinte verifiee)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor (version figee dans uv.lock, audits en ligne)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --only-group ci zizmor --format=github .github/workflows/

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (binaire officiel, empreinte verifiee)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      # Scans avant toute installation : l'arbre ne contient que le depot.
      - name: gitleaks sur tout l'historique (lignes ajoutees)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --config .gitleaks.toml .'
      - name: gitleaks sur l'arbre (fichiers entiers, regles composites)
        run: '"$RUNNER_TEMP/gitleaks" dir --redact --no-banner --verbose --config .gitleaks.toml .'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_SHA256_LINUX_X64 }}
          enable-cache: true
      - run: uv sync --locked
      # Garde-fous anti-fuite cote serveur : les hooks locaux se contournent
      # (--no-verify, clone sans pre-commit install), pas ce controle. Il porte
      # sur tous les fichiers de l'historique, y compris ceux supprimes depuis.
      - name: aucun fichier interdit dans l'historique
        run: |
          git log --all --name-only --format= | sort -u \
            | uv run python scripts/verifier_chemins.py
      - name: regles gitleaks verifiees avec ce binaire
        run: GITLEAKS_BIN="$RUNNER_TEMP/gitleaks" uv run pytest -q tests/test_gitleaks.py

  # Seul check a rendre obligatoire (#13) : son nom ne change pas quand la
  # matrice evolue, et il echoue si un seul job echoue ou est annule.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test, nox-windows, workflow-lint, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: tous les jobs ont reussi
        env:
          RESULTATS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultats : $RESULTATS"
          for r in $RESULTATS; do
            [ "$r" = "success" ] || exit 1
          done
