# Configuration gitleaks : hook pre-commit et job CI.
# Les regles par defaut couvrent deja les cles AWS (aws-access-token), les secrets
# d'application Entra (azure-ad-client-secret) et les cles privees PEM
# (private-key). On ne les remplace pas, on les etend.
# tests/test_outillage.py verifie ces regles sur des cas positifs et negatifs.
title = "amnesia"

[extend]
useDefault = true

# amnesia se connecte a des hotes (WinRM, SSH, API) : des identifiants ne doivent
# jamais apparaitre en clair dans une URL, ex. winrm://audit:Motdepasse1@dc01.
# Le mot de passe peut contenir « : » ou « @ » : il va jusqu'au dernier « @ ».
[[rules]]
id = "identifiants-dans-une-url"
description = "Identifiants en clair dans une URL"
regex = '''(?i)\b[a-z][a-z0-9+.-]{1,20}://[^\s:@/'"`]{1,64}:([^\s/'"`]{6,128})@[^\s@/'"`]{1,253}'''
secretGroup = 1
entropy = 2.5
keywords = ["://"]

[[rules.allowlists]]
description = "Valeurs d'exemple evidentes"
regexTarget = "secret"
regexes = [
  '''(?i)^(<[^>]*>|x{3,}|\*{3,}|password|passw0rd|motdepasse|changeme|example|secret)$''',
  # gabarits : {mdp} (f-string, str.format), ${MDP}, $(commande), $MDP, %MDP%
  '''^(\{[^{}]*\}|\$\{[^{}]*\}|\$\([^()]*\)|\$[A-Z_][A-Z0-9_]*|%[A-Za-z_][A-Za-z0-9_]*%)$''',
]

# Un secret au format libre (mot de passe WinRM, secret Graph) n'a pas de forme
# reconnaissable ; a cote d'un identifiant de tenant ou d'application Entra, il en
# a une. Regle composite : elle n'est fiable qu'en mode dir (hook
# gitleaks-fichiers et scan de l'arbre en CI). En mode git, gitleaks ne lit que
# les lignes ajoutees et ne voit pas un GUID deja commite.
[[rules]]
id = "guid-entra"
description = "Identifiant de tenant ou d'application Entra (contexte, jamais rapporte seul)"
# GUID annonce comme tenant, client ou application : TENANT_ID=..., AZURE_TENANT_ID=,
# "tenantId": "...", tenant: ..., $tenant = ..., -TenantId / -Tenant / --tenant ...,
# ou URL d'autorite login.microsoftonline.com/<GUID>. Un GUID quelconque (id Graph,
# GUID auditpol) ne compte pas.
regex = '''(?i)(?:(?:tenant|client|app(?:lication)?|directory)(?:[_-]?id)?["']?(?:\s*[:=]\s*|\s+)["']?\{?|login\.microsoftonline\.(?:com|us)/)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'''
skipReport = true

[[rules]]
id = "secret-pres-d-un-guid-entra"
description = "Secret ou mot de passe a proximite d'un identifiant Entra"
regex = '''(?i)(?:client[_-]?secret|secret|password|passwd|pwd|credential)[\w.-]{0,20}["']?(?:\s*[:=]\s*|\s+)["']?([^\s"'#\[\](){}$<>,;]{8,128})'''
secretGroup = 1
entropy = 3.0
keywords = ["secret", "passw", "pwd", "credential"]

[[rules.required]]
id = "guid-entra"
withinLines = 5

[[rules.allowlists]]
description = "Identifiants de code et valeurs d'exemple, pas des secrets"
regexTarget = "secret"
regexes = [
  # lettres, points, tirets et soulignes seuls : nom de classe, de fonction ou de
  # politique (ClientSecretCredential, keyring.get_password, Read-Host,
  # DisablePasswordExpiration). Meme garde-fou que la regle generic-api-key.
  # Compromis accepte : une phrase de passe sans chiffre ni symbole echappe a
  # cette regle.
  '''^[a-zA-Z_.-]+$''',
  '''(?i)^(x{3,}|\*{3,}|changeme|placeholder)$''',
]
