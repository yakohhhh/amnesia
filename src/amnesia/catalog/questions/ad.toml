  { kind = "microsoft", id = "MS-GPAC", url = "https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-gpac/77878370-0712-47cd-997d-b07053429f6d" },
]

# --- Modifications de l'annuaire -------------------------------------------

[[question]]
id = "Q-AD-GPO-CHANGE"
status = "planned"
domain = "ad"
theme = "persistence"
roles = ["dc"]
severity_default = "high"
text.fr = "Quelles stratégies de groupe (GPO) ont été modifiées il y a {lookback}, et par qui ?"
why.fr = "Une GPO modifiée déploie du code ou affaiblit la sécurité sur tout un parc ; sans trace du changement, ni son auteur ni son contenu d'origine ne sont connus."
sources = [
  "SRC-AD-5136-GPO",
]
checks = []
references = [
  { kind = "microsoft", id = "MS-GPAC", url = "https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-gpac/77878370-0712-47cd-997d-b07053429f6d" },
]

[[question]]
id = "Q-AD-ACL-CHANGE"
status = "planned"
domain = "ad"
theme = "persistence"
roles = ["dc"]
severity_default = "high"
text.fr = "Quels objets de l'annuaire ont vu leurs droits d'accès (ACL) modifiés il y a {lookback}, et par qui ?"
why.fr = "Un droit ajouté sur un objet sensible est une porte dérobée discrète dans l'annuaire ; sans audit des modifications, elle survit à la remédiation."
sources = [
  "SRC-AD-5136-ACL",
]
checks = []
references = [
  { kind = "microsoft", id = "MS-GPAC", url = "https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-gpac/77878370-0712-47cd-997d-b07053429f6d" },
]

[[question]]
id = "Q-AD-CERT-ISSUE"
status = "planned"
domain = "ad"
theme = "authentication"
roles = ["dc", "server"]
severity_default = "medium"
text.fr = "Quels certificats l'autorité de certification {host} a-t-elle délivrés il y a {lookback}, et à quels demandeurs ?"
why.fr = "Un certificat obtenu frauduleusement permet de s'authentifier à la place d'un autre compte, même après un changement de mot de passe ; sans journal des délivrances, il reste valide et inconnu."
sources = [
  "SRC-AD-4886-4887",
]
