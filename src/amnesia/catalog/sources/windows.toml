# Sources de télémétrie du domaine windows.
#
# Une table [[source]] par source : un événement (canal, fournisseur, Event
# IDs, filtres) ou un réglage, avec ses prérequis. Format : docs/catalogue.md.
# enabled_by_default est omis tant que le comportement d'une installation par
# défaut n'est pas établi ; les valeurs présentes restent à confirmer sur des
# hôtes de référence (#50). GUID des sous-catégories d'audit : MS-GPAC.

# --- Ouvertures de session -------------------------------------------------

[[source]]
id = "SRC-SEC-4624-T10"
kind = "event"
title = "Ouverture de session à distance réussie (RDP, LogonType 10)"
