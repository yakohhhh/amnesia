# Hooks locaux : uv run pre-commit install
# Chaque rev est un SHA de commit (immuable) ; la version est dans le commentaire
# « frozen ». La version de ruff doit rester celle de uv.lock (verifie par
# tests/test_outillage.py).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: interdire-rapports-amnesia
        name: interdire les rapports et bundles amnesia (donnees client)
        language: fail
        entry: >-
          Rapport, bundle ou PDF amnesia : ce sont des donnees client, ils ne
          doivent jamais etre commites (meme avec git add -f).
        files: '(^|/)amnesia-(report|bundle|out)[^/]*(/|$)|(^|/)[^/]*\.amnesia\.json$|^(?!docs/).*\.pdf$'
